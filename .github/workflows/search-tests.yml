name: Location search tests
on:
  pull_request:
  push:
    branches: [main, master, claude/map-artwork-background-gen-rf0dwj]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
